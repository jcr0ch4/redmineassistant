name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Syntax check
        run: python -m py_compile app_flet.py acoes.py atualizar_redmine.py config_manager.py download_atividades.py ferramentas.py logger_app.py ollama_client.py paths.py redmine_api.py